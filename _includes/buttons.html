<section id="buttons">
  <style>
    #buttons {
      padding: 100px 0;
      background-color: #FFFFFD;
    }
    #buttons h2 {
      margin-bottom: 10px;
    }
    .links-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin-top: 40px;
    }
    .btn-link-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background-color: #fffffd;
      border: 2px solid #2274ab;
      color: #2274ab;
      border-radius: 6px;
      padding: 18px 24px;
      text-decoration: none;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
      width: 320px;
      min-height: 80px;
      text-align: center;
    }
    .btn-link-item:hover,
    .btn-link-item:focus {
      background-color: #2274ab;
      color: #fffffd;
      text-decoration: none;
    }
    .btn-link-item i {
      font-size: 1.6em;
      margin: 12px;
    }
    .link-title {
      font-weight: 700;
      font-size: 1em;
      line-height: 1.3;
      margin: 8px;

    }
    .link-desc {
      margin: auto 0 25px;
      font-size: 18px;
      line-height: 1.5;
      opacity: 0.9
    }
  </style>

  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2>{{ page.title }}</h2>
      </div>
    </div>
    <div class="row">
      <div class="col-lg-12">
        <div class="links-grid">
          {% assign sorted_links = site.links | sort: 'order' %}
          {% for link in sorted_links %}
          <a href="{{ link.href }}" target="_blank" rel="noopener noreferrer" class="btn-link-item">
            {% if link.icon %}
            <i class="fa {{ link.icon }}" aria-hidden="true"></i>
            {% endif %}
            <h4>{{ link.title }}</h4>
            {% if link.description %}
            <span class="link-desc">{{ link.description }}</span>
            {% endif %}
          </a>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</section>
